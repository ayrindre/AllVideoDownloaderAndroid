name: Android APK build

# Builds the KivyMD mobile port with python-for-android. The sandbox this
# project is developed in has no JDK/Android SDK, so all packaging happens on
# GitHub-hosted runners (full network access to dl.google.com, Maven, PyPI).
on:
  push:
    branches:
      - arena/f73e798f-allvideodownloaderandroid
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub release

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (offline, pure Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx yt-dlp arabic-reshaper python-bidi pillow pytest
      - name: Run the desktop-engine fixture suite against the mobile engine
        working-directory: android
        env:
          AVD_HOME: /tmp/avd-ci-home
        run: |
          for t in test_video_core test_coverage test_cookies test_engine_service; do
            PYTHONPATH=src python tests/$t.py
          done

  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-24.04
    needs: engine-tests
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages required by python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip wget patch make \
            autoconf automake autopoint libtool libltdl-dev pkg-config \
            zlib1g-dev libstdc++6 \
            cmake libffi-dev libssl-dev build-essential ccache lbzip2

      - name: Install buildozer + pinned python-for-android
        run: |
          python -m pip install --upgrade pip
          # buildozer 1.6.0 pins cython<3.0 which conflicts with modern p4a
          # (Python 3.14 / Kivy 2.3.1 need Cython 3.x); 1.5.0 has no such pin.
          pip install --upgrade "Cython>=3.0,<3.2" \
            "buildozer==1.5.0" "python-for-android==2026.5.9"

      - name: Verify the bundled FFmpeg executables are arm64 ELF
        working-directory: android
        run: |
          test -x src/assets/bin/arm64-v8a/ffmpeg
          test -x src/assets/bin/arm64-v8a/ffprobe
          python - <<'PY'
          for path in ("src/assets/bin/arm64-v8a/ffmpeg",
                       "src/assets/bin/arm64-v8a/ffprobe"):
              head = open(path, "rb").read(20)
              assert head[:4] == b"\x7fELF" and head[4] == 2
              assert int.from_bytes(head[18:20], "little") == 183
              print("valid arm64 ELF:", path)
          PY

      # Speed up repeat builds; a missing/corrupt cache simply rebuilds.
      - name: Cache buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-p4a2026.5.9-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-p4a2026.5.9-

      - name: Build debug APK with buildozer
        working-directory: android
        run: buildozer -v android debug

      - name: Collect the APK
        id: apk
        run: |
          APK=$(find android/bin -name "*.apk" -type f | head -1)
          test -n "$APK"
          cp "$APK" AllVideoDownloader-3.0.0-arm64-v8a-debug.apk
          ls -lh AllVideoDownloader-3.0.0-arm64-v8a-debug.apk
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK contents (manifest, FFmpeg, fonts, engine)
        working-directory: android
        run: |
          set -e
          APK=$(find bin -name "*.apk" -type f | head -1)
          test -n "$APK"
          python - "$APK" <<'PY'
          import sys, zipfile, tarfile, tempfile, pathlib
          apk = pathlib.Path(sys.argv[1])
          assert zipfile.is_zipfile(apk), "APK is not a valid zip"
          with zipfile.ZipFile(apk) as z:
              bad = z.testzip()
              assert bad is None, f"corrupt entry in APK: {bad}"
              names = z.namelist()
              # native arm64 libraries (python, SDL2, …)
              assert any(n.startswith("lib/arm64-v8a/") for n in names), "no arm64 native libs"
              assert "assets/private.tar" in names, "p4a private.tar missing"
              with tempfile.TemporaryDirectory() as td:
                  z.extract("assets/private.tar", td)
                  with tarfile.open(pathlib.Path(td) / "assets/private.tar") as tar:
                      members = tar.getnames()
                      def must_have(needle):
                          assert any(needle in m for m in members), f"missing in private.tar: {needle}"
                      must_have("assets/bin/arm64-v8a/ffmpeg")
                      must_have("assets/bin/arm64-v8a/ffprobe")
                      must_have("assets/fonts/Vazirmatn-Regular.ttf")
                      must_have("assets/fonts/Vazirmatn-Bold.ttf")
                      must_have("main.py")
                      must_have("avd/ui/app.py")
                      must_have("avd/core/media.py")
                      ff = [m for m in members if m.endswith("bin/arm64-v8a/ffmpeg")][0]
                      f = tar.extractfile(ff)
                      head = f.read(20)
                      assert head[:4] == b"\x7fELF" and head[4] == 2, "ffmpeg not ELF64"
                      assert int.from_bytes(head[18:20], "little") == 183, "ffmpeg not AArch64"
                      print("private.tar entries checked:", len(members))
          print("APK structure OK")
          PY
          # Manifest-level checks with the SDK's aapt
          AAPT=$(find "$HOME/.buildozer" -type f -name aapt | head -1)
          [ -z "$AAPT" ] && AAPT=$(find "$HOME/.buildozer" -type f -name aapt2 | head -1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" > badging.txt 2>/dev/null || true
            grep -q "package: name='ir.avd.allvideodownloader'" badging.txt
            grep -q "sdkVersion:'29'" badging.txt
            grep -q "native-code: 'arm64-v8a'" badging.txt
            grep -q "android.permission.INTERNET" badging.txt
            grep -q "android.permission.WAKE_LOCK" badging.txt
            grep -q "android.intent.action.SEND" badging.txt
            echo "manifest checks OK"
            cat badging.txt | head -12
          else
            echo "::warning::aapt not found, skipped manifest checks"
          fi

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllVideoDownloader-APK
          path: AllVideoDownloader-3.0.0-arm64-v8a-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish / refresh the rolling GitHub release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=android-v3.0.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AllVideoDownloader-3.0.0-arm64-v8a-debug.apk \
              --clobber
          else
            gh release create "$TAG" \
              AllVideoDownloader-3.0.0-arm64-v8a-debug.apk \
              --title "All Video Downloader — Android v3.0.0" \
              --prerelease \
              --notes "Mobile rewrite (KivyMD, Persian RTL UI) with the desktop
              link engine, bundled arm64-v8a FFmpeg/FFprobe and yt-dlp.
              Debug-signed APK for sideloading (minSdk 29)."
          fi
